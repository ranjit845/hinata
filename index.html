<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Hinta Profile</title>

        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                min-height: 100vh;
                background: #050505;
                display: flex;
                justify-content: center;
                align-items: center;
                font-family: Arial, sans-serif;
                color: white;
            }

            .card {
                width: 340px;
                aspect-ratio: 1 / 1;
                padding: 25px;
                background: linear-gradient(145deg, #19151f, #09090c);
                border: 1px solid #393044;
                border-radius: 22px;
                text-align: center;
                box-shadow: 0 15px 50px rgba(168, 85, 247, 0.15);
                transition: 0.4s ease;
            }

            .card:hover {
                transform: translateY(-8px);
                border-color: #a855f7;
                box-shadow: 0 15px 50px #a855f740;
            }

            .profile-img {
                width: 125px;
                height: 125px;
                object-fit: cover;
                border-radius: 18px;
                border: 2px solid #a855f7;
                box-shadow: 0 0 20px #a855f750;
                transition: 0.4s ease;
            }

            .profile-img:hover {
                transform: scale(1.12);
            }

            h1 {
                margin-top: 18px;
                font-size: 29px;
                letter-spacing: 2px;
            }

            .subtitle {
                color: #a78bfa;
                font-size: 12px;
                letter-spacing: 3px;
                margin-top: 6px;
                text-transform: uppercase;
            }

            .details {
                display: flex;
                justify-content: space-around;
                margin-top: 25px;
                padding: 15px 5px;
                background: #ffffff08;
                border: 1px solid #ffffff15;
                border-radius: 14px;
            }

            .details h2 {
                font-size: 20px;
                color: #c084fc;
            }

            .details p {
                color: #999;
                font-size: 12px;
                margin-top: 6px;
            }

            .rank {
                margin-top: 18px;
                padding: 10px;
                border-radius: 10px;
                background: linear-gradient(90deg, #7e22ce, #a855f7);
                font-size: 14px;
                font-weight: bold;
            }
        </style>
    </head>

    <body>
        <div class="card">
            <img
                class="profile-img"
                src="C:\Users\Samrat\Downloads\9392140.png"
                alt="Hinta Profile"
            />

            <h1>Hinta</h1>
            <p class="subtitle">Student Profile</p>

            <div class="details">
                <div>
                    <h2>16</h2>
                    <p>AGE</p>
                </div>

                <div>
                    <h2>01</h2>
                    <p>RANK</p>
                </div>
            </div>

            <div class="rank">★ TOP PERFORMER</div>
        </div>
    </body>
</html>
